# Pruebas en cada push y pull request a main. Mismo Python y mismas versiones que el tablero en Render; el dataset
# completo no viaja, así que las pruebas usan datos sintéticos y lo que trae data/ y artifacts/.
name: pruebas

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11.9"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
